name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore "Akiled Emulator.sln"

      - name: Build (Release)
        run: dotnet build "Akiled Emulator.sln" --configuration Release --no-restore

      - name: Publish (Linux x64)
        run: |
          dotnet publish AkiledEmulator.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output ./publish/linux-x64 \
            -p:PublishSingleFile=true \
            -p:DebugType=none

      - name: Publish (Windows x64)
        run: |
          dotnet publish AkiledEmulator.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            --output ./publish/win-x64 \
            -p:PublishSingleFile=true \
            -p:DebugType=none

      - name: Create archives
        run: |
          cd publish
          zip -r ../AkiledEmulator-${{ steps.version.outputs.VERSION }}-linux-x64.zip linux-x64/
          zip -r ../AkiledEmulator-${{ steps.version.outputs.VERSION }}-win-x64.zip win-x64/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AkiledEmulator ${{ steps.version.outputs.VERSION }}
          tag_name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            AkiledEmulator-${{ steps.version.outputs.VERSION }}-linux-x64.zip
            AkiledEmulator-${{ steps.version.outputs.VERSION }}-win-x64.zip
